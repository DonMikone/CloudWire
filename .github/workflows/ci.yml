name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # BUILD = commit count

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: make test

      - name: Build app and DMG
        run: make app dmg VERSION="0.0.0-ci.$GITHUB_RUN_NUMBER"

      - uses: actions/upload-artifact@v7
        with:
          name: CloudWire-0.0.0-ci.${{ github.run_number }}
          path: |
            build/CloudWire-*.dmg
            build/CloudWire-*.dmg.sha256
          if-no-files-found: error
