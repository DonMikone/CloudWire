name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 120
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # BUILD = commit count

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve version
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build app
        run: make app VERSION="$VERSION"

      - name: Sign and notarise
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: scripts/sign-and-notarize.sh

      - name: Build DMG
        # The signing step already produced a notarised, stapled DMG when Apple secrets exist;
        # rebuilding it would drop the stapled ticket.
        run: |
          if [ -f "build/CloudWire-$VERSION.dmg" ]; then
            echo "Using the notarised DMG from the signing step"
          else
            make dmg VERSION="$VERSION"
          fi

      - name: Release notes
        run: sed "s/{{VERSION}}/$VERSION/g" scripts/release-notes.md.tmpl > build/release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [ "${VERSION%%.*}" = "0" ] || [[ "$TAG" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$TAG" \
            "build/CloudWire-$VERSION.dmg" "build/CloudWire-$VERSION.dmg.sha256" \
            --title "CloudWire $VERSION" \
            --notes-file build/release-notes.md \
            $prerelease
